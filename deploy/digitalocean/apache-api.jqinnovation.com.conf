<VirtualHost *:80>
    ServerName api.jqinnovation.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:8080/ timeout=300
    ProxyPassReverse / http://127.0.0.1:8080/

    # Replace client-supplied values; the relay trusts these headers only from
    # this loopback proxy. REQUEST_SCHEME becomes https in Certbot's TLS vhost.
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    LimitRequestBody 536870912

    ErrorLog ${APACHE_LOG_DIR}/api.jqinnovation.com-error.log
    CustomLog ${APACHE_LOG_DIR}/api.jqinnovation.com-access.log combined
</VirtualHost>
