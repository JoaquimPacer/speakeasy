name: iOS CI

on:
  pull_request:
    paths:
      - ".github/workflows/ios-ci.yml"
      - "ios/**"
      - "testdata/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-ci.yml"
      - "ios/**"
      - "testdata/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iPhone simulator tests
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List Kithra project
        run: xcodebuild -list -project ios/Kithra.xcodeproj

      - name: Select and boot an iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')"
          if [[ -z "$device_id" ]]; then
            echo "No available iPhone simulator was found."
            xcrun simctl list devices available
            exit 1
          fi
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b

      - name: Test Kithra on iPhone Simulator
        run: |
          xcodebuild test \
            -project ios/Kithra.xcodeproj \
            -scheme Kithra \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}' \
            -derivedDataPath "$RUNNER_TEMP/KithraDerivedData"
